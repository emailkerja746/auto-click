plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.autoclick'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.autoclick"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // ML Kit - Text Recognition (OCR) untuk deteksi tulisan di layar
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Untuk deteksi gambar (template matching) kita pakai OpenCV.
    // Cara termudah: download OpenCV Android SDK dari opencv.org,
    // lalu import sebagai module dan tambahkan:
    // implementation project(':opencv')
    //
    // Sebagai alternatif ringan tanpa OpenCV, project ini sudah
    // menyertakan ImageMatcher.kt versi manual (tanpa dependency luar).
}
